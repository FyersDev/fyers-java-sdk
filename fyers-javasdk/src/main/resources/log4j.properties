# Root logger option - set to WARN to reduce noise from libraries
log4j.rootLogger=WARN, stdout, file

# Redirect log messages to console
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%t] %c{1}:%L - %m%n

# Redirect log messages to a log file
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=logs/1009/fyers-debug.log
log4j.appender.file.MaxFileSize=50MB
log4j.appender.file.MaxBackupIndex=10
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%t] %c{1}:%L - %m%n

# Enable INFO logging for App class to see test logs
log4j.logger.com.example.App=INFO

# Enable DEBUG logging for FyersSocket class to see all logs (INFO, WARN, ERROR, DEBUG)
# Change to INFO if you want to reduce verbosity and skip debug messages
log4j.logger.com.example.websocket.FyersSocket=DEBUG

# Reduce noise from other libraries
log4j.logger.org.eclipse.jetty=WARN
log4j.logger.in.tts.hsjavalib=WARN
log4j.logger.org.apache.http=WARN
log4j.logger.httpclient=WARN
log4j.logger.org.apache.commons.httpclient=WARN
